services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nocturna
      POSTGRES_USER: nocturna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup_env.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nocturna -d nocturna']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    expose:
      - 11434
    gpus: all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  ollama-init:
   container_name: ollama-init
   image: ollama/ollama:latest
   depends_on:
    ollama:
      condition: service_healthy
   environment:
    OLLAMA_HOST: http://ollama:11434
   command: ["pull", "qwen3.5:9b"]
   restart: no
    

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://nocturna:${POSTGRES_PASSWORD}@postgres:5432/nocturna?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_APP_NAME: ${TELEGRAM_APP_NAME:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Run python3 scripts/setup_env.py first}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      DEFAULT_OLLAMA_MODEL: ${DEFAULT_OLLAMA_MODEL:-qwen3:8b}
      BOT_ENABLED: ${BOT_ENABLED:-false}
      HTTP_ADDR: :8081
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:80'
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data:
  ollama:
